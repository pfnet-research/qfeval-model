name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Build the merged commit or the release tag. Publish these exact files.
  build:
    if: >-
      github.event_name == 'release' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve the release version
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag="v${HEAD_BRANCH#release/}"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9][0-9a-zA-Z.+]*$ ]]; then
            echo '::error::Use a release/<version> branch or a valid package version tag.'
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: make lint
      - run: make test
      - run: uv build
      - name: Check the package metadata and README render
        run: uvx twine check --strict dist/*
      - name: Check the release tag matches the package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ ! -e "dist/qfeval_model-${VERSION}.tar.gz" ]; then
            # Workflow commands are read from stdout, not stderr.
            echo "::error::Release version ${VERSION} does not match the build:"
            ls dist/
            exit 1
          fi
      - name: Check the CHANGELOG dates this release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! grep -F "## [${VERSION}] - " CHANGELOG.md | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::CHANGELOG.md needs a dated heading for ${VERSION}"
            exit 1
          fi
      - name: Check the sdist carries no workspace artifacts
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '\.import_linter_cache|/site/|/dist/|\.ipynb$'; then
            echo "::error::the sdist contains workspace artifacts (see above)"
            exit 1
          fi
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import numpy as np
          import pandas as pd
          from importlib.resources import files

          import qfeval_model as qm

          print(qm.__version__)
          assert files("qfeval_model").joinpath("py.typed").is_file()
          prices = pd.DataFrame(
              [[1.0, 2.0], [3.0, 4.0]],
              index=pd.date_range("2024-01-01", periods=2),
              columns=["A", "B"],
          )
          model = qm.zoo.lag("close")
          pred = model.predict(prices)
          assert pred.to_wide().shape == (2, 2)
          restored = qm.zoo.lag("close").loads(model.dumps())
          next_day = prices.rename(index=lambda ts: ts + pd.Timedelta(days=2))
          assert np.array_equal(
              restored.predict(next_day).array[0], prices.to_numpy()[-1]
          )
          EOF
      - name: Type-check a wheel-only consumer
        run: |
          cat >/tmp/qfeval_consumer.py <<'EOF'
          import qfeval_model as qm
          from qfeval_model import metrics, verify, zoo

          @qm.model
          def scaled(ctx: qm.Context, factor: float) -> None:
              for step in ctx:
                  step.output = step.inputs["close"] * factor

          model: qm.Model = scaled(2.0)
          _ = (model, metrics, verify, zoo)
          EOF
          mypy_bin="$PWD/.venv/bin/mypy"
          sed 's/scaled(2.0)/scaled("bad")/' /tmp/qfeval_consumer.py >/tmp/qfeval_consumer_bad.py
          cd /tmp
          "$mypy_bin" --strict --python-executable /tmp/smoke/bin/python qfeval_consumer.py
          if "$mypy_bin" --strict --python-executable /tmp/smoke/bin/python qfeval_consumer_bad.py; then
            echo "::error::wheel typing did not reject a bad decorated-model argument"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    if: github.event_name == 'pull_request'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # This release uses GITHUB_TOKEN, so it does not trigger a second workflow.
      - name: Create the GitHub release and attach the published files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "$TAG" --generate-notes dist/*.whl dist/*.tar.gz dist/SHA256SUMS
