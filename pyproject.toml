[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qfeval-model"
dynamic = ["version"]
description = "Write prediction models over timestamp x symbol panel data as plain decorated Python functions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Preferred Networks, Inc." },
]
keywords = [
    "backtesting",
    "panel-data",
    "prediction",
    "quantitative-finance",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
]

[project.urls]
Repository = "https://github.com/pfnet-research/qfeval-model"
Documentation = "https://github.com/pfnet-research/qfeval-model/tree/main/docs"
Issues = "https://github.com/pfnet-research/qfeval-model/issues"
Changelog = "https://github.com/pfnet-research/qfeval-model/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
examples = [
    "ipynb-py-convert>=0.4.6",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.hatch.version]
path = "src/qfeval_model/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qfeval_model"]

# The sdist ships what a downstream rebuild/verification needs (source,
# tests, docs, examples) while omitting bulky artifacts tied to this
# repository's own operations (CI workflows, lockfile, benchmarks, site).
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "mkdocs.yml",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "DESIGN.en.md",
    "DESIGN.ja.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Ideally this would match the oldest supported runtime (3.10, as ruff's
# target-version does), but numpy's stubs use PEP 695 `type` statements,
# which mypy only parses with python_version >= 3.12. CI runs the test
# suite on 3.10, which is what actually guards the lower bound.
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["qfeval_model"]
branch = true

[tool.coverage.report]
# The suite sits above 98% branch coverage; the gate is set close enough
# that a large silent regression fails CI (coverage is a canary — the
# public contracts themselves are guarded by the invariant tests).
fail_under = 95
show_missing = true

[tool.importlinter]
root_package = "qfeval_model"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: external features -> core"
type = "layers"
layers = [
    "qfeval_model.zoo | qfeval_model.metrics | qfeval_model.verify",
    "qfeval_model.core",
]

# The pandas ban covers exactly the leaf modules below; the rest of the core
# may use pandas.
[[tool.importlinter.contracts]]
name = "Leaf engine modules stay numpy-only"
type = "forbidden"
source_modules = [
    "qfeval_model.core.constants",
    "qfeval_model.core.errors",
]
forbidden_modules = ["pandas"]
